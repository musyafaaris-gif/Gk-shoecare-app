workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Scaffold Android platform
        script: |
          flutter create --platforms=android --org com.gkshoecare .
      - name: Set app name
        script: |
          perl -i -pe 's/android:label="[^"]*"/android:label="GK Shoe Care"/' android/app/src/main/AndroidManifest.xml
      - name: Add camera permission
        script: |
          perl -i -pe 's|<application|    <uses-permission android:name="android.permission.CAMERA" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Get packages
        script: |
          flutter pub get
      - name: Generate app icon
        script: |
          dart run flutter_launcher_icons
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
